# Can Git for Windows be built and run without MSYS2, and do native git and
# busybox-w32 work inside an MXC ProcessContainer?
name: git without MSYS2 in MXC ProcessContainer
on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: git/git ref to build
        default: master
      mxc_ref:
        description: iangrunert/mxc ref to build wxc-exec from
        default: main
  push:
    branches: [git-no-msys2]
    paths: ['git-no-msys2/**', '.github/workflows/git-no-msys2.yml']
permissions:
  contents: read
jobs:
  build:
    name: build git (${{ matrix.variant }}, MSVC + busybox tools)
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: x64
            runner: windows-2025
            busybox: https://frippery.org/files/busybox/busybox64.exe
            delayload: false
          - variant: arm64
            runner: windows-11-arm
            busybox: https://frippery.org/files/busybox/busybox64a.exe
            delayload: false
          - variant: arm64-delayload-user32
            runner: windows-11-arm
            busybox: https://frippery.org/files/busybox/busybox64a.exe
            delayload: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: scratch
      - uses: actions/checkout@v4
        with:
          repository: git/git
          ref: ${{ inputs.git_ref || 'master' }}
          path: gitsrc
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install meson ninja pefile
      - name: Build (MSYS2 and Git for Windows hidden)
        shell: pwsh
        run: scratch/git-no-msys2/build-git.ps1 -Source gitsrc -Prefix C:/git-native -BusyboxUrl ${{ matrix.busybox }} -DelayLoadUser32:$${{ matrix.delayload }}
      - name: Restore hidden directories
        if: always()
        shell: pwsh
        run: |
          $f = Join-Path $env:RUNNER_TEMP 'hidden-dirs.txt'
          if (Test-Path $f) { Get-Content $f | ForEach-Object { if ($_) { Rename-Item "$_.hidden" (Split-Path $_ -Leaf) } } }
      - name: Check DLL imports (no msys-2.0.dll / cygwin1.dll)
        run: python scratch/git-no-msys2/check_imports.py C:/git-native
      - name: Smoke test outside the sandbox
        shell: pwsh
        run: |
          Get-ChildItem -Recurse C:\git-native -File | Measure-Object -Sum Length | ForEach-Object { "files=$($_.Count) bytes=$($_.Sum)" }
          C:\git-native\bin\git.exe --version --build-options
          C:\git-native\bin\git.exe --exec-path
      - uses: actions/upload-artifact@v4
        with:
          name: git-native-${{ matrix.variant }}
          path: C:/git-native
          retention-days: 7

  build-mxc:
    # Built from source: current MXC has no AppContainer fallback tiers, so the
    # probe and every launch either use native BaseContainer (PSEC) or refuse.
    # Only windows-11-arm (Windows 11 25H2) has the native PSEC API set; the x64
    # windows-2025 image is Windows Server and probes without it.
    name: build wxc-exec (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: iangrunert/mxc
          ref: ${{ inputs.mxc_ref || 'main' }}
          path: mxc
      - name: Toolchain and dependency feed
        shell: bash
        working-directory: mxc
        run: |
          cp src/rust-toolchain.toml rust-toolchain.toml
          cat .azure-pipelines/.cargo/config.public.toml >> .cargo/config.toml
          rustup show active-toolchain || rustup toolchain install 1.93 --profile minimal
          rustup target add ${{ matrix.target }}
          git -C . log -1 --format='mxc %H %s'
      - name: cargo build wxc-exec
        shell: bash
        working-directory: mxc/src
        run: cargo build --locked --release --target ${{ matrix.target }} -p wxc --bin wxc-exec
      - uses: actions/upload-artifact@v4
        with:
          name: wxc-exec-${{ matrix.arch }}
          path: mxc/src/target/${{ matrix.target }}/release/wxc-exec.exe
          retention-days: 7

  mxc:
    name: MXC BaseContainer (${{ matrix.variant }}, Win32k for git ${{ matrix.git_ui && 'allowed' || 'blocked' }})
    needs: [build, build-mxc]
    if: ${{ !cancelled() && needs.build-mxc.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: arm64
            arch: arm64
            git_ui: true
          - variant: arm64-delayload-user32
            arch: arm64
            git_ui: false
    runs-on: windows-11-arm
    env:
      BUSYBOX_URL: https://frippery.org/files/busybox/busybox64a.exe
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: scratch
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: git-native-${{ matrix.variant }}
          path: C:/git-native
      - uses: actions/download-artifact@v4
        with:
          name: wxc-exec-${{ matrix.arch }}
          path: ${{ runner.temp }}/mxc
      - name: Fetch busybox-w32
        shell: pwsh
        run: Invoke-WebRequest $env:BUSYBOX_URL -OutFile (Join-Path $env:RUNNER_TEMP 'busybox.exe') -MaximumRetryCount 5 -RetryIntervalSec 10
      - name: Run git and busybox inside ProcessContainer
        shell: pwsh
        run: >
          scratch/git-no-msys2/test-in-mxc.ps1
          -WxcExec "$env:RUNNER_TEMP\mxc\wxc-exec.exe"
          -GitRoot C:\git-native
          -BusyboxExe "$env:RUNNER_TEMP\busybox.exe"
          -OutDir "$env:RUNNER_TEMP\mxc-out"
          -GitWithoutUi:$${{ !matrix.git_ui }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mxc-results-${{ matrix.variant }}-gitui-${{ matrix.git_ui }}
          path: ${{ runner.temp }}/mxc-out
